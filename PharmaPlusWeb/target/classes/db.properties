# ========================================
# PHARMAPLUS - CONFIGURACIÓN BASE DE DATOS
# ========================================

# Driver JDBC para MySQL
db.driver=org.mariadb.jdbc.Driver
db.url=jdbc:mariadb://localhost:3306/pharmaplus_db
db.username=root
db.password=

# Pool de conexiones (opcional - para HikariCP o C3P0)
db.pool.minSize=5
db.pool.maxSize=20
db.pool.timeout=30000

# ========================================
# NOTAS:
# ========================================
# 1. Ubicar este archivo en: src/main/resources/
# 2. Para producción, cambiar las credenciales
# 3. useSSL=false solo para desarrollo local
# 4. serverTimezone=UTC para evitar problemas de zona horaria
# 5. allowPublicKeyRetrieval=true para MySQL 8.0+
# ========================================

# CONFIGURACIÓN ALTERNATIVA PARA XAMPP (Windows)
# db.url=jdbc:mysql://localhost:3306/pharmaplus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# db.username=root
# db.password=

# CONFIGURACIÓN ALTERNATIVA PARA PRODUCCIÓN
# db.url=jdbc:mysql://servidor-prod:3306/pharmaplus_db?useSSL=true&serverTimezone=UTC
# db.username=pharmaplus_user
# db.password=contraseña_segura_aqui